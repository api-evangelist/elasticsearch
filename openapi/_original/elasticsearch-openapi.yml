openapi: 3.1.0
info:
  title: Elasticsearch REST API
  version: "8.x"
  description: >-
    Elasticsearch REST API provides programmatic access to document indexing,
    searching, aggregations, index lifecycle, and cluster operations.
    Supports basic authentication and API keys.
  contact:
    name: Elastic
    url: https://www.elastic.co/guide/en/elasticsearch/reference/current/rest-apis.html
servers:
  - url: https://{host}:{port}
    description: Elasticsearch cluster
    variables:
      host:
        default: localhost
      port:
        default: "9200"
security:
  - basicAuth: []
  - apiKeyAuth: []
paths:
  /{index}:
    put:
      summary: Create index
      operationId: createIndex
      tags: [Index]
      parameters:
        - in: path
          name: index
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                settings:
                  type: object
                mappings:
                  type: object
      responses:
        '200':
          description: Index created
    get:
      summary: Get index info
      operationId: getIndex
      tags: [Index]
      parameters:
        - in: path
          name: index
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Index info
    delete:
      summary: Delete index
      operationId: deleteIndex
      tags: [Index]
      parameters:
        - in: path
          name: index
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
    head:
      summary: Check index existence
      operationId: indexExists
      tags: [Index]
      parameters:
        - in: path
          name: index
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Exists
        '404':
          description: Not found
  /{index}/_doc/{id}:
    put:
      summary: Index a document
      operationId: indexDocument
      tags: [Document]
      parameters:
        - in: path
          name: index
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Indexed
        '201':
          description: Created
    get:
      summary: Get a document
      operationId: getDocument
      tags: [Document]
      parameters:
        - in: path
          name: index
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Document
    delete:
      summary: Delete a document
      operationId: deleteDocument
      tags: [Document]
      parameters:
        - in: path
          name: index
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
  /{index}/_update/{id}:
    post:
      summary: Update a document
      operationId: updateDocument
      tags: [Document]
      parameters:
        - in: path
          name: index
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                doc:
                  type: object
                script:
                  type: object
      responses:
        '200':
          description: Updated
  /{index}/_search:
    get:
      summary: Search documents (URI)
      operationId: searchUri
      tags: [Search]
      parameters:
        - in: path
          name: index
          required: true
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: size
          schema:
            type: integer
        - in: query
          name: from
          schema:
            type: integer
      responses:
        '200':
          description: Search results
    post:
      summary: Search documents (DSL)
      operationId: searchDsl
      tags: [Search]
      parameters:
        - in: path
          name: index
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: object
                aggs:
                  type: object
                size:
                  type: integer
                from:
                  type: integer
      responses:
        '200':
          description: Search results
  /_bulk:
    post:
      summary: Bulk index operations
      operationId: bulk
      tags: [Document]
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
      responses:
        '200':
          description: Bulk results
  /_cluster/health:
    get:
      summary: Cluster health
      operationId: clusterHealth
      tags: [Cluster]
      responses:
        '200':
          description: Health
  /_cluster/state:
    get:
      summary: Cluster state
      operationId: clusterState
      tags: [Cluster]
      responses:
        '200':
          description: State
  /_cluster/stats:
    get:
      summary: Cluster stats
      operationId: clusterStats
      tags: [Cluster]
      responses:
        '200':
          description: Stats
  /_cat/indices:
    get:
      summary: Cat indices
      operationId: catIndices
      tags: [Cat]
      parameters:
        - in: query
          name: v
          schema:
            type: boolean
      responses:
        '200':
          description: Plain text table
          content:
            text/plain:
              schema:
                type: string
  /_cat/nodes:
    get:
      summary: Cat nodes
      operationId: catNodes
      tags: [Cat]
      responses:
        '200':
          description: Plain text table
          content:
            text/plain:
              schema:
                type: string
  /_cat/health:
    get:
      summary: Cat health
      operationId: catHealth
      tags: [Cat]
      responses:
        '200':
          description: Plain text table
          content:
            text/plain:
              schema:
                type: string
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
